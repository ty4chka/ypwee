name: build

"on":
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      build_toolchain:
        description: "Build ypwee with Yukino toolchain (may fail: pre-alpha sources)"
        required: false
        default: "false"

jobs:
  docs:
    # PR-валидация: README/Markdown и YAML корректны
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint markdown links
        run: |
          # каждая локальная ссылка в README-файлах должна существовать
          for f in README*.md docs/*.md; do
            grep -oE '\]\(([^)]+\.md)\)' "$f" 2>/dev/null | sed 's/](\(.*\))/\1/' | while read -r link; do
              [ -f "$link" ] || { echo "broken link in $f: $link"; exit 1; }
            done
          done
          echo "links ok"
      - name: Validate YAML
        run: python3 -c "import yaml,sys; yaml.safe_load(open('.github/workflows/build.yml'))"

  toolchain:
    # Проверяет, что Yukino toolchain собирается (LLVM 22 нужен для llvm-sys)
    runs-on: ubuntu-latest
    steps:
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            /tmp/yukino/target
          key: yukino-tc-${{ runner.os }}
      - name: Install LLVM 22
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-22 main" | sudo tee /etc/apt/sources.list.d/llvm22.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm-22-dev libpolly-22-dev libzstd-dev zlib1g-dev
          echo "LLVM_SYS_221_PREFIX=/usr/lib/llvm-22" >> $GITHUB_ENV
          sudo ln -sf /usr/lib/llvm-22/bin/llvm-ar /usr/local/bin/llvm-ar
      - name: Build Yukino
        run: |
          if [ ! -x /tmp/yukino/target/release/yukic ]; then
            git clone --depth 1 https://github.com/yukitsuri/yukino /tmp/yukino
            cd /tmp/yukino && cargo build --release 2>&1 | tail -3
          fi
          sudo cp /tmp/yukino/target/release/yukic /tmp/yukino/target/release/yukino /usr/local/bin/
          yukino --version || true

  build:
    if: github.event.inputs.build_toolchain == 'true' || startsWith(github.ref, 'refs/tags/v')
    needs: toolchain
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Compile ypwee (pre-alpha)
        continue-on-error: true
        run: |
          yukino build release
          find . -type f -perm -u+x -name 'ypwee' | head -1 | xargs -I{} cp {} dist/ypwee-linux-x86_64
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: false
