name: Strix Security Scan

on:
  workflow_dispatch:
    inputs:
      scan_mode:
        description: "quick | standard | deep"
        default: quick
      scope_mode:
        description: "auto | diff | full"
        default: full

jobs:
  strix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Strix
        run: |
          curl -sSL https://strix.ai/install | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Strix
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
        run: |
          strix -n -t ./ -m "${{ github.event.inputs.scan_mode }}" \
                --scope-mode "${{ github.event.inputs.scope_mode }}" \
                || code=$?
          code=${code:-0}
          echo "STRIX_EXIT=$code" >> "$GITHUB_ENV"
          exit 0

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strix-report
          path: strix_runs/
          if-no-files-found: warn
